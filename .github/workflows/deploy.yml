name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run lint
      run: npm run lint
      continue-on-error: true

    - name: Build application
      run: npm run build
      env:
        # Mocking required build-time env vars if any
        MONGODB_URI: "mongodb://localhost:27017/unused_db"
        NEXT_PUBLIC_REFRESH_INTERVAL: 30000
