events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ── Map Subdomain to Tenant ID ──────────────────────────────────────────
    # Example: apple.nexuspos.local -> Extract 'apple'
    map $host $tenant_id {
        hostnames;
        default "";
        ~^(?P<tenant>.+)\.nexuspos\.local$ $tenant;
    }

    server {
        listen 80;
        server_name *.nexuspos.local nexuspos.local;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Multi-Tenant Injection ──────────────────────────────────────────
        # Inject the tenant slug into the upstream header
        proxy_set_header X-Tenant-ID $tenant_id;

        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # Health check
        location /_health {
            return 200 'OK';
        }
    }
}
